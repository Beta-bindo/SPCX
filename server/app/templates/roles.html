<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>交易助手 · 角色管理</title>
  <link rel="stylesheet" href="/static/admin_common.css" />
</head>
<body>
  <div class="wrap">
    <div id="loginCard" class="card login-card hidden">
      <h1 class="login-heading">交易助手 · 运营后台</h1>
      <p class="sub">使用后台账号登录（默认用户名 <code>admin</code>）</p>
      <div class="row">
        <input id="adminUsername" type="text" placeholder="用户名" value="admin" style="min-width:140px" autocomplete="username" />
        <input id="adminPassword" type="password" placeholder="密码" style="min-width:220px" autocomplete="current-password" />
        <button id="loginBtn" type="button">登录</button>
      </div>
      <p id="loginErr" class="err hidden"></p>
    </div>

    <div id="panel" class="hidden admin-shell">
      <aside id="adminSidebar" class="admin-sidebar">
        <div class="sidebar-head">
          <span class="sidebar-brand">运营后台</span>
          <button type="button" id="sidebarToggle" class="sidebar-toggle secondary" title="收起侧栏" aria-label="收起侧栏">◀</button>
        </div>
        <nav id="adminNavLinks" class="sidebar-nav" aria-label="后台导航"></nav>
        <div class="sidebar-foot">
          <div id="adminUserLabel" class="sidebar-user"></div>
          <div class="sidebar-actions">
            <button type="button" class="secondary sidebar-foot-btn" title="修改密码" onclick="openChangePasswordDialog(localStorage.getItem('ta_admin_token')||'')"><span class="sidebar-icon">🔑</span><span class="sidebar-label">改密</span></button>
            <button type="button" class="secondary sidebar-foot-btn" title="退出登录" onclick="logout()"><span class="sidebar-icon">⏻</span><span class="sidebar-label">退出</span></button>
          </div>
        </div>
      </aside>
      <main class="admin-main">
        <header class="admin-page-head">
          <h1>交易助手 · 角色管理</h1>
          <p class="sub">配置后台角色可访问的模块权限</p>
        </header>

      <div class="card filter-bar">
        <button onclick="openRoleDialog()">新建角色</button>
        <button class="secondary" onclick="loadRoles()">刷新</button>
        <span id="listColumnSlot"></span>
      </div>

      <div class="card">
        <div class="table-scroll">
        <table id="roleListTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
        </div>
      </div>
      </main>
    </div>
  </div>

<script src="/static/admin_common.js?v=13"></script>
<script>
const ACTIVE_MODULE = 'roles';
const ROLE_LIST_ID = 'roles';
const ROLE_LIST_COLUMNS = [
  { key: 'name', label: '角色名称' },
  { key: 'description', label: '说明' },
  { key: 'modules', label: '模块权限' },
  { key: 'user_count', label: '用户数' },
  { key: 'type', label: '类型' },
  { key: 'actions', label: '操作', locked: true },
];
let adminToken = '';
let moduleDefs = [];

function logout() { logoutAdmin(); }

async function loadModuleDefs() {
  const res = await fetch('/api/v1/admin/modules', { headers: authHeaders(adminToken) });
  if (res.status === 401) return logout();
  if (!res.ok) return;
  const data = await res.json();
  moduleDefs = data.modules || [];
}

function modulesText(role) {
  if ((role.modules || []).includes('*')) return '全部模块';
  const labels = role.module_labels || [];
  return labels.length ? labels.join('、') : '-';
}

function renderRoleCell(key, role) {
  switch (key) {
    case 'name': return `<b>${esc(role.name)}</b>`;
    case 'description': return esc(role.description || '-');
    case 'modules': return esc(modulesText(role));
    case 'user_count': return String(role.user_count || 0);
    case 'type': return role.is_builtin ? '内置' : '自定义';
    case 'actions':
      return `<div class="cell-actions">
        <button class="btn-inline secondary" type="button" data-edit="${role.id}">编辑</button>
        ${role.is_builtin ? '' : `<button class="btn-inline danger" type="button" data-del="${role.id}">删除</button>`}
      </div>`;
    default: return '-';
  }
}

function bindRoleRow(tr, role) {
  tr.querySelector('[data-edit]')?.addEventListener('click', () => openRoleDialog(role));
  tr.querySelector('[data-del]')?.addEventListener('click', () => deleteRole(role));
}

async function loadRoles() {
  const res = await fetch('/api/v1/admin/roles', { headers: authHeaders(adminToken) });
  if (res.status === 401) return logout();
  if (res.status === 403) {
    alert('无权限访问角色管理');
    return;
  }
  if (!res.ok) {
    alert(await readError(res) || '加载失败');
    return;
  }
  const data = await res.json();
  applyListTable({
    listId: ROLE_LIST_ID,
    defs: ROLE_LIST_COLUMNS,
    tableEl: document.getElementById('roleListTable'),
    rows: data.roles || [],
    renderCell: renderRoleCell,
    onRow: bindRoleRow,
  });
}

function openRoleDialog(role = null) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const card = document.createElement('div');
  card.className = 'modal-card';

  const heading = document.createElement('h2');
  heading.textContent = role ? '编辑角色' : '新建角色';

  const nameField = document.createElement('label');
  nameField.className = 'modal-field';
  nameField.textContent = '角色名称';
  const nameInput = document.createElement('input');
  nameInput.className = 'modal-text';
  nameInput.maxLength = 64;
  nameInput.value = role?.name || '';
  nameInput.disabled = Boolean(role?.is_builtin);
  nameField.appendChild(nameInput);

  const descField = document.createElement('label');
  descField.className = 'modal-field';
  descField.textContent = '说明';
  const descInput = document.createElement('input');
  descInput.className = 'modal-text';
  descInput.maxLength = 256;
  descInput.value = role?.description || '';
  descField.appendChild(descInput);

  const modWrap = document.createElement('div');
  modWrap.className = 'modal-field';
  modWrap.textContent = '模块权限';
  const modList = document.createElement('div');
  modList.className = 'modal-checks';
  const selected = new Set(role?.modules || []);
  const allChecked = selected.has('*');
  const allRow = document.createElement('label');
  allRow.className = 'modal-check';
  const allInput = document.createElement('input');
  allInput.type = 'checkbox';
  allInput.checked = allChecked;
  allRow.append(allInput, ' 全部模块（超级管理员）');
  modList.appendChild(allRow);
  const itemInputs = [];
  for (const mod of moduleDefs) {
    const row = document.createElement('label');
    row.className = 'modal-check';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.value = mod.key;
    input.checked = allChecked || selected.has(mod.key);
    input.disabled = allChecked;
    row.append(input, ` ${mod.label}`);
    modList.appendChild(row);
    itemInputs.push(input);
  }
  modWrap.appendChild(modList);

  const syncAll = () => {
    const on = allInput.checked;
    for (const input of itemInputs) {
      input.disabled = on;
      if (on) input.checked = false;
    }
  };
  allInput.addEventListener('change', syncAll);

  const err = document.createElement('p');
  err.className = 'err modal-hint';
  err.style.display = 'none';

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'secondary';
  cancelBtn.textContent = '取消';
  const okBtn = document.createElement('button');
  okBtn.type = 'button';
  okBtn.textContent = role ? '保存' : '创建';

  const close = () => backdrop.remove();

  cancelBtn.addEventListener('click', close);
  okBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    if (!name) {
      err.textContent = '请输入角色名称';
      err.style.display = 'block';
      return;
    }
    const modules = allInput.checked ? ['*'] : itemInputs.filter((i) => i.checked).map((i) => i.value);
    if (!modules.length) {
      err.textContent = '请至少选择一个模块';
      err.style.display = 'block';
      return;
    }
    const payload = {
      name,
      description: descInput.value.trim(),
      modules,
    };
    const url = role ? `/api/v1/admin/roles/${role.id}` : '/api/v1/admin/roles';
    const method = role ? 'PATCH' : 'POST';
    okBtn.disabled = true;
    const res = await fetch(url, {
      method,
      headers: authHeaders(adminToken),
      body: JSON.stringify(payload),
    });
    if (res.status === 401) return logout();
    if (!res.ok) {
      okBtn.disabled = false;
      err.textContent = await readError(res) || '保存失败';
      err.style.display = 'block';
      return;
    }
    close();
    await loadRoles();
  });

  actions.append(cancelBtn, okBtn);
  card.append(heading, nameField, descField, modWrap, err, actions);
  backdrop.appendChild(card);
  document.body.appendChild(backdrop);
  nameInput.focus();
}

async function deleteRole(role) {
  if (!confirm(`确定删除角色「${role.name}」？`)) return;
  const res = await fetch(`/api/v1/admin/roles/${role.id}`, {
    method: 'DELETE',
    headers: authHeaders(adminToken),
  });
  if (res.status === 401) return logout();
  if (!res.ok) {
    alert(await readError(res) || '删除失败');
    return;
  }
  await loadRoles();
}

async function bootPanel() {
  mountListColumnControl(document.getElementById('listColumnSlot'), ROLE_LIST_ID, ROLE_LIST_COLUMNS, loadRoles);
  await loadModuleDefs();
  await loadRoles();
}

wireAdminLoginButton(async (token) => {
  adminToken = token;
  renderAdminNav(ACTIVE_MODULE);
  await bootPanel();
});

initAdminPage(ACTIVE_MODULE, async (token) => {
  adminToken = token;
  await bootPanel();
});
</script>
</body>
</html>
